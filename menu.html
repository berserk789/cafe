<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منو</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f2ec;--c:#fff;--tx:#2a2118;--mu:#7a6d60;--bd:#e6ddd0;--pr:#8a5a2b;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#17130f;--c:#221c16;--tx:#f1e9de;--mu:#a89a8a;--bd:#383027;--pr:#c9954f;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px}h2{font-size:14px;color:var(--mu);margin:18px 0 8px}
.r{display:flex;justify-content:space-between;background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.r b{color:var(--pr)}
</style>
</head>
<body>
<div class="w"><h1>☕ منو</h1><div id="m"></div></div>
<script>
const nf=new Intl.NumberFormat('fa-IR');
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const row=a=>`<div class="r"><span>${e(a.n)}</span><b>${nf.format(Number(a.price)||0)}</b></div>`;
let last='';
async function go(){
try{
const t=await(await fetch('menu.json?'+Date.now(),{cache:'no-store'})).text();
if(t===last)return;
const a=JSON.parse(t);
last=t;
const i=a.filter(v=>v.k!='x'),x=a.filter(v=>v.k=='x');
document.getElementById('m').innerHTML=i.map(row).join('')+(x.length?'<h2>اضافه‌ها</h2>'+x.map(row).join(''):'');
}catch(_){}
}
go();setInterval(go,20000);
</script>
</body>
</html>
